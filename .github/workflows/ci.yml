name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted (run 'gofmt -w .'):"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: go mod tidy -diff

  freebsd:
    # The library is FreeBSD-only and links against libzfs, so it is built and
    # tested inside a FreeBSD VM running under QEMU on the Linux runner. Tests
    # run as root with ZFS_TEST_DESTRUCTIVE=1 and create throwaway file-backed
    # pools; the VM is discarded afterwards.
    name: FreeBSD ${{ matrix.release }}
    runs-on: ubuntu-latest
    # A normal run takes ~3 minutes; occasionally the VM hangs while booting
    # under nested virtualization. Fail fast so the job can be re-run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.1"]
    steps:
      - uses: actions/checkout@v7

      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: ${{ matrix.release }}
          copyback: false
          cache-after-prepare: true
          cache-after-prepare-key-suffix: ${{ hashFiles('.github/scripts/freebsd-ci-prepare.sh') }}
          prepare: |
            sh .github/scripts/freebsd-ci-prepare.sh
          run: |
            set -e
            export GOFLAGS=-buildvcs=false
            freebsd-version -ku
            go version
            sh .github/scripts/freebsd-ci-pool.sh
            go vet ./...
            go build ./...
            go build ./examples/...
            ZFS_TEST_DESTRUCTIVE=1 go test -count=1 -p 1 -v ./...
